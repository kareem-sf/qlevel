name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Rust + TypeScript + IPC Contract Gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & Secret-Service system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies & build dist for Tauri context check
        run: |
          pnpm install --frozen-lockfile=false
          pnpm -r typecheck
          pnpm --filter @qlevel/desktop build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy workspace lints (zero warnings, zero unwrap, zero float math)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit dependency licenses & advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Verify Rust <-> TypeScript IPC contract synchronization
        run: cargo run -p qlevel-bridge --bin export_bindings -- --check

      - name: Run full Rust unit & golden tender fixture tests
        run: cargo test --workspace
