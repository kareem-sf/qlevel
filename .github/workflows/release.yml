name: Release Binaries & Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-arm64
            runner: macos-15
            args: "--target aarch64-apple-darwin"
          - platform: macos-x64
            runner: macos-15
            args: "--target x86_64-apple-darwin"
          - platform: linux-x64
            runner: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Install Ubuntu 22.04 (glibc 2.35) system libraries
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install JS workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri installers & desktop binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "qlevel ${{ github.ref_name }}"
          releaseBody: "Automated cross-platform release with SHA256SUMS and Sigstore build provenance."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Stage Windows Zero-Admin Portable Executable
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/qlevel-desktop.exe" "dist-artifacts/qlevel-portable-windows-x64.exe"
          $hash = (Get-FileHash "dist-artifacts/qlevel-portable-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  qlevel-portable-windows-x64.exe" | Out-File -Encoding utf8 "dist-artifacts/SHA256SUMS-windows-portable.txt"

      - name: Upload Windows Portable Executable & SHA256SUMS to GitHub Release
        if: matrix.platform == 'windows-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-artifacts/* --clobber

      - name: Generate Cryptographic Sigstore Build Provenance (Public Repo)
        if: ${{ matrix.platform == 'windows-x64' && !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: "dist-artifacts/qlevel-portable-windows-x64.exe"
